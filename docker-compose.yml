version: "3.9"

services:
  db:
    image: postgres:18-alpine
    container_name: shortplay-local-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shortplay
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: shortplay
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
